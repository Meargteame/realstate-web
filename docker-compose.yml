services:
  postgres:
    image: postgres:15-alpine
    container_name: kw_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-kw_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kw_password123}
      POSTGRES_DB: ${DB_NAME:-kw_realestate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kw_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kw_backend
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-kw_user}:${DB_PASSWORD:-kw_password123}@postgres:5432/${DB_NAME:-kw_realestate}?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - NODE_ENV=production
      # - JWT_SECRET=your_jwt_secret_here
      # - ALLOWED_ORIGINS=http://your-vps-ip,https://yourdomain.com
    ports:
      - "5000:5000"
    restart: unless-stopped
    command: sh -c "npx prisma generate && npx prisma db push && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kw_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

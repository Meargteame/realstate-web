# ═══════════════════════════════════════════════════════════
# TORRA Real Estate — Production Docker Compose (Hostinger VPS)
# ═══════════════════════════════════════════════════════════
# Run with: docker compose -f docker-compose.prod.yml up -d --build
#
# Architecture:
#   Internet → Caddy (:80, :443 auto-SSL)
#                ├── /api/*     → backend:5000
#                ├── /uploads/* → backend:5000
#                ├── /socket.io → backend:5000 (WebSocket)
#                └── /*         → frontend:80  (Nginx SPA)
# ═══════════════════════════════════════════════════════════

services:
  # ── Database ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: torra_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-torra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-torra_realestate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-torra_user} -d ${DB_NAME:-torra_realestate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # ── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: torra_redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # ── Node.js API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: torra_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOT exposed to host — Caddy proxies to it internally
    expose:
      - "5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-torra_user}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-torra_realestate}?schema=public
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - FRONTEND_URL=https://${DOMAIN:?Set DOMAIN in .env}
      - ALLOWED_ORIGINS=https://${DOMAIN},https://www.${DOMAIN}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && node server.js"
    networks:
      - internal

  # ── React SPA (Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
    container_name: torra_frontend
    depends_on:
      - backend
    # NOT exposed to host — Caddy proxies to it internally
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - internal

  # ── HTTPS Reverse Proxy (auto Let's Encrypt) ──────────────
  caddy:
    image: caddy:2-alpine
    container_name: torra_caddy
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:       # Let's Encrypt certs persisted here
  caddy_config:

networks:
  internal:
    driver: bridge

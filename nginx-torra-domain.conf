# TORRA Real Estate — Host Nginx Reverse Proxy (DOMAIN version)
# Replaces nginx-torra.conf once you have a domain pointed at the server.
#
# Place at: /etc/nginx/sites-available/torra
# Enable:   ln -sf /etc/nginx/sites-available/torra /etc/nginx/sites-enabled/torra
#           rm -f /etc/nginx/sites-enabled/default     # drop the catch-all default
#           nginx -t && systemctl reload nginx
#
# ⚠️  Replace YOURDOMAIN.com (3 places) with your real domain BEFORE running.
# Then add HTTPS automatically:
#   certbot --nginx -d YOURDOMAIN.com -d www.YOURDOMAIN.com
# Certbot rewrites this file to add the :443 SSL block + HTTP→HTTPS redirect,
# and sets up auto-renewal. The www→root redirect below is preserved.

upstream torra_frontend {
    server 127.0.0.1:3000;
}

upstream torra_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

# www → root (canonical = bare domain)
server {
    listen 80;
    server_name www.YOURDOMAIN.com;
    return 301 $scheme://YOURDOMAIN.com$request_uri;
}

server {
    listen 80;
    server_name YOURDOMAIN.com;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Client body size (for file uploads)
    client_max_body_size 20M;

    # API proxy
    location /api/ {
        proxy_pass http://torra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # WebSocket proxy (Socket.IO)
    location /socket.io {
        proxy_pass http://torra_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Uploaded files proxy
    location /uploads/ {
        proxy_pass http://torra_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Frontend (SPA via Docker Nginx)
    location / {
        proxy_pass http://torra_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
